#cloud-config
package_update: true
packages:
  - ca-certificates
  - curl
  - openssl
  - restic
  - unattended-upgrades
  - ufw
users:
  - default
  - name: suoops
    groups: [sudo, docker]
    shell: /bin/bash
    lock_passwd: true
    sudo: "ALL=(ALL) NOPASSWD:ALL"
groups:
  - docker
ssh_pwauth: false
write_files:
  - path: /etc/sysctl.d/90-suoops-redis.conf
    owner: root:root
    permissions: "0644"
    content: |
      vm.overcommit_memory = 1
  - path: /usr/local/sbin/suoops-bootstrap
    owner: root:root
    permissions: "0700"
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      sysctl -p /etc/sysctl.d/90-suoops-redis.conf
      install -d -m 0755 /etc/apt/keyrings
      curl --fail --show-error --silent --location --retry 3 \
        https://download.docker.com/linux/ubuntu/gpg \
        --output /etc/apt/keyrings/docker.asc
      chmod 0644 /etc/apt/keyrings/docker.asc
      printf '%s\n' \
        'deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu noble stable' \
        > /etc/apt/sources.list.d/docker.list
      apt-get update
      DEBIAN_FRONTEND=noninteractive apt-get install -y \
        docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
      systemctl enable --now docker
      install -d -m 0700 -o suoops -g suoops /home/suoops/.ssh
      test -s /root/.ssh/authorized_keys
      install -m 0600 -o suoops -g suoops \
        /root/.ssh/authorized_keys /home/suoops/.ssh/authorized_keys
      install -d -m 0750 -o suoops -g suoops /opt/suoops
      printf '%s\n' 'PasswordAuthentication no' 'KbdInteractiveAuthentication no' \
        > /etc/ssh/sshd_config.d/00-suoops.conf
      sshd -t
      systemctl reload ssh
      ufw default deny incoming
      ufw default allow outgoing
      ufw allow 22/tcp
      ufw allow 80/tcp
      ufw allow 443/tcp
      ufw allow 443/udp
      ufw --force enable
      printf '%s\n' 'APT::Periodic::Update-Package-Lists "1";' \
        'APT::Periodic::Unattended-Upgrade "1";' \
        > /etc/apt/apt.conf.d/20auto-upgrades
      docker compose version
      touch /var/lib/suoops-bootstrap-complete
runcmd:
  - [bash, /usr/local/sbin/suoops-bootstrap]
