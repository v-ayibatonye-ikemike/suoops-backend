name: Dependency Vulnerability Scan
on:
  push:
    branches: [ main ]
  pull_request:
jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Run pip-audit (requirements.txt)
        run: |
          # CVE-2026-49452 (weasyprint) has NO upstream fix release yet. We render
          # only our own templates (not attacker HTML), so exploitability is low.
          # Ignore it here so CI stays strict for everything else; remove when a
          # patched weasyprint ships.
          if [ -f requirements.txt ]; then
            pip-audit -r requirements.txt --ignore-vuln CVE-2026-49452 --format json --output pip-audit-report.json
          else
            echo 'requirements.txt not found'; exit 1
          fi
      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit-report.json